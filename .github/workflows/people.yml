name: Refresh community people

# GitHub does not disclose who viewed a profile. This job lists people who
# follow nazsam or starred a featured repo, then writes their avatars into README.md.

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  watch:
    types: [started]
  issues:
    types: [opened, edited]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build people block
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = 'nazsam';
            const featured = [
              'zero-trust-reference-architecture',
              'soc-detection-engineering',
              'agent-security-skills',
              'ai-security-lab',
              'security-operations-toolkit',
              'kubernetes-security-lab',
            ];
            const SLOTS = 2000;
            const SHOW_AVATARS = 48;
            const people = new Map();
            const followers = await github.paginate(github.rest.users.listFollowersForUser, {
              username: owner,
              per_page: 100,
            });
            for (const u of followers) {
              if (u && u.login && u.login !== owner) {
                people.set(u.login, { href: u.html_url, avatar: `${u.html_url}.png?size=64` });
              }
            }
            for (const repo of featured) {
              try {
                const stars = await github.paginate(github.rest.activity.listStargazersForRepo, {
                  owner,
                  repo,
                  per_page: 100,
                });
                for (const u of stars) {
                  if (u && u.login && u.login !== owner) {
                    people.set(u.login, { href: u.html_url, avatar: `${u.html_url}.png?size=64` });
                  }
                }
              } catch (err) {
                core.warning(`Could not list stargazers for ${repo}: ${err.message}`);
              }
            }
            const active = [...people.values()].slice(0, Math.min(SHOW_AVATARS, SLOTS));
            const cells = [
              `<a href="https://github.com/${owner}"><img src="https://github.com/${owner}.png?size=64" width="32" height="32" alt="subscriber"/></a>`,
            ];
            for (const p of active) {
              cells.push(`<a href="${p.href}"><img src="${p.avatar}" width="32" height="32" alt="subscriber"/></a>`);
            }
            const inner = `<p align="center">\n  ${cells.join('\n  ')}\n</p>\n<a href="https://github.com/${owner}?tab=followers"><img src="https://raw.githubusercontent.com/nazsam/nazsam/main/assets/followers-2000.png" width="220" alt="2000 follower slots"/></a>`;
            const readmePath = 'README.md';
            const readme = fs.readFileSync(readmePath, 'utf8');
            const start = '<!-- PEOPLE:START -->';
            const end = '<!-- PEOPLE:END -->';
            const next = readme.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              `${start}\n${inner}\n${end}`
            );
            if (next === readme) {
              core.setFailed('PEOPLE markers not found in README.md');
              return;
            }
            fs.writeFileSync(readmePath, next);

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No people changes" && exit 0
          git commit -m "Refresh community people on the profile README."
          git push
