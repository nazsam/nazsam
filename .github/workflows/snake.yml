name: Generate Contribution Snake

# Builds the animated contribution-snake SVG and commits it as nazsam.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit as S Naz
        run: |
          git config user.name "S Naz"
          git config user.email "306537611+devsecforge@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git diff --cached --quiet && echo "No snake changes" && exit 0
          git commit -m "Update contribution snake."
          git push origin HEAD:output
