<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="About Me">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C242C"/>
      <stop offset="0.55" stop-color="#2A3840"/>
      <stop offset="1" stop-color="#3E4E56"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.7">
      <stop offset="0" stop-color="#E8A07A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8A07A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="1200" height="140" rx="12" fill="url(#bg)"/>
  <rect width="280" height="140" fill="url(#dots)"/>
  <rect width="1200" height="140" fill="url(#glow)"/>
  <rect x="0" y="0" width="10" height="140" fill="#E8A07A"/>
  <text x="40" y="52" fill="#E8A07A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="5">WHO I AM</text>
  <text x="40" y="102" fill="#F7F3EE" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">About Me</text>
</svg>
